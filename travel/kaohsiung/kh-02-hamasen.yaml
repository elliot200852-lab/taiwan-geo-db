# 旅遊地圖・高雄市・第 2 區：鹽埕・哈瑪星・駁二
# 範圍（zones.yaml）：駁二藝術特區、大港橋、棧貳庫、高雄流行音樂中心、哈瑪星鐵道文化園區、舊打狗驛、武德殿、代天宮、新濱碼頭、打狗英國領事館、西子灣、壽山（動物園、情人觀景台）、鹽埕老店（三郎餐包、鴨肉珍、阿綿麻糬、港園牛肉麵本店）、高雄市立歷史博物館。
# 欄位同 kh-01-central-park.yaml；查不到的欄位留空，不要猜。營業時間以官網／Google 商家頁核對。
# 來源與核對：景點用各館官網（駁二、高流、棧貳庫、史博館、鐵道館、領事館、壽山動物園）；小吃用 2026 年媒體報導（鏡週刊、Yahoo 旅遊、TVBS 食尚玩家）交叉比對；
#   代天宮、新濱碼頭地址取自 OpenStreetMap；金馬賓館、新濱·駅前、柴山1號、鼓山輪渡站、新濱町海洋廚房沿用 kh-01（比歐摺頁／線上版）資料。
# 小吃與店家營業時間常變，出發前打電話最準。
id: kh-02
city: 高雄市
city_id: kaohsiung
order: 2
name: 鹽埕・哈瑪星・駁二
