          - {zh: "高雄流行音樂中心", en: "Kaohsiung Music Center", addr: "鹽埕區真愛路1號", mrt: [C11, C10], exit: "輕軌真愛碼頭站（光榮碼頭站也近）", hours: ["戶外園區全天開放", "室內音浪塔 週二至週日 10:00–22:00"], tel: "07 521 8012", note: "室內週一休館，演出日時間另訂。", q: "高雄流行音樂中心"}
          - {zh: "新濱碼頭", en: "Shinbin Pier", addr: "鼓山區濱海一路", mrt: [O1, C14], note: "哈瑪星海邊的碼頭，新濱町海洋廚房在同一條濱海一路上。", q: "新濱碼頭"}
          - {zh: "鼓山輪渡站", en: "Gushan Ferry Station", addr: "鼓山區濱海二路1號", mrt: [O1], exit: "西子灣站1號出口步行約 7–10 分鐘（麗雄街直走，濱海一路右轉）", tel: "07 551 4316", note: "去旗津的渡輪在這裡上船。", q: "鼓山輪渡站"}

  - id: eco
