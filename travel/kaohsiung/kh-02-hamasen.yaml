updated: 2026-10-27

sections:
  - id: food
    title: 食
    lead: 鹽埕靠新樂街、五福四路一帶的老店，哈瑪星靠代天宮廟口。兩區走路約 20 分鐘，可以半天吃一輪。
    groups:
      - name: 鹽埕老店
        cat: snack
        items:
          - {zh: "鴨肉珍", en: "Duck Zhen", addr: "鹽埕區五福四路258號", mrt: [O2], hours: ["週三至週一 10:00–20:20"], tel: "07 521 5018", note: "招牌是煙燻鴨肉，另有肉燥飯；週二公休。米其林指南收錄。"}
          - {zh: "阿伯肉粽（鹽埕埔王家粽）", en: "Uncle's Rice Dumplings", addr: "鹽埕區新樂街242巷29號", mrt: [O2], hours: ["週二至週日 07:30–賣完為止"], tel: "07 521 4507", note: "只賣早上，中午前常賣完；週一公休。"}
          - {zh: "阿忠米粉湯", en: "A-Zhong Rice Noodle Soup", addr: "鹽埕區新樂街229號", mrt: [O2], hours: ["每日 06:30–14:00"], tel: "0972 501 220", note: "粗米粉湯，早上到中午。公休日沒查到，先電話確認。", ll: [22.62583, 120.28112]}
          - {zh: "北港蔡三代筒仔米糕", en: "Beigang Tsai Tube Rice Cake", addr: "鹽埕區河西路167號", mrt: [O2], hours: ["週四至週二 13:30–21:30"], tel: "07 551 7443", note: "下午才開；週三公休。"}
          - {zh: "鹽埕鴨肉意麵", en: "Yancheng Duck Yi-mein", addr: "鹽埕區大智路126號", mrt: [O2], hours: ["週日至週五 17:00–22:00"], tel: "07 561 5572", note: "傍晚才開；週六公休。"}
          - {zh: "李家圓仔湯", en: "Li's Tangyuan Soup", addr: "鹽埕區五福四路234號", mrt: [O2], hours: ["週二至週日 11:00–19:00"], tel: "07 521 1418", note: "週一公休。跟鴨肉珍在同一條五福四路，可以接著吃。", ll: [22.62475, 120.28204]}
          - {zh: "樺達奶茶（鹽埕總店）", en: "Hua Da Milk Tea", addr: "鹽埕區新樂街101號", mrt: [O2], hours: ["每日 09:00–22:00"], tel: "07 551 2151", note: "媒體稱它是高雄奶茶的創始店，總店在新樂街。"}
      - name: 牛肉麵
        cat: noodle
        items:
          - {zh: "港園牛肉麵（本店）", en: "Gang Yuan Beef Noodle Soup", addr: "鹽埕區大成街55號", mrt: [O2], hours: ["每日 10:30–20:00"], tel: "07 561 3842", note: "1953 年創立；用餐時間店外常排隊，建議避開尖峰。自強三路那間是分店，這裡才是本店。"}
      - name: 伴手禮
        cat: gift
        items:
          - {zh: "三郎餐包", en: "Saburou Bakery", addr: "鹽埕區新樂街198-8號", mrt: [O2], exit: "2號出口", hours: ["週三至週一 11:00–18:00"], tel: "07 551 5841", note: "奶油餐包，賣完提早打烊；週二公休。巷子裡，從大仁路三信銀行旁進去。", q: "三郎餐包", ll: [22.6257, 120.28252]}
          - {zh: "阿綿麻糬", en: "A-Mian Mochi", addr: "鹽埕區新樂街198-27號", mrt: [O2], tel: "07 531 9177", note: "手工麻糬，離三郎餐包很近（門牌 198-8 與 198-27）。每日營業到約 19:00，但開門時間各來源寫 10:00 或 11:00，出發前先電話確認。"}
      - name: 哈瑪星小吃
        cat: snack
        note: "集中在代天宮廟口與鼓元街一帶，步行串得起來。多數早上或下午就收，晚上去會撲空。"
        items:
          - {zh: "哈瑪星呂汕頭麵", en: "Lu's Shantou Noodles", addr: "鼓山區鼓波街27-16號", mrt: [O1, C14], hours: ["每日 09:30–18:00"], tel: "07 532 3228", note: "代天宮廟口一帶。公休日沒查到。"}
          - {zh: "哈瑪星黑旗魚丸大王", en: "Hamasen Black Marlin Fishball", addr: "鼓山區鼓波街27-7號", mrt: [O1, C14], hours: ["每日 10:30–20:00"], tel: "07 521 0948", note: "代天宮廟口一帶，魚丸湯。公休日沒查到。"}
          - {zh: "哈瑪星碗粿枝", en: "Hamasen Bowl Rice Cake", addr: "鼓山區鼓元街59號", mrt: [O1, C14], hours: ["週二至週日 06:30–賣完為止"], tel: "0912 786 280", note: "早餐碗粿；賣完就收，週一公休。"}
          - {zh: "萬全肉圓米糕", en: "Wanquan Meatball & Sticky Rice", addr: "鼓山區臨海一路1號", mrt: [O1, C14], hours: ["週二至週日 06:00–16:00"], tel: "07 533 0498", note: "週一公休。", ll: [22.62009, 120.27275]}
          - {zh: "愛買漢堡店", en: "Aimai Burger", addr: "鼓山區鼓元街68號", mrt: [O1, C14], hours: ["每日 06:00–11:00"], tel: "07 561 7378", note: "早餐店，只開到上午；不定期公休。"}
      - name: 咖啡・餐廳
        cat: cafe
        items:
          - {zh: "新濱·駅前", en: "Hamasen 1921", addr: "鼓山區臨海三路5號", mrt: [O1, C14], exit: "2號出口", hours: ["每日 10:00–19:00"], tel: "07 531 5770", note: "舊三和銀行高雄支店改的咖啡館，店內留著銀行金庫。"}
          - {zh: "柴山1號海洋咖啡", en: "Chaishan No.1", addr: "鼓山區柴山1號", hours: ["週四至週二 11:00–19:00"], tel: "07 525 0256", note: "海邊第一排的景觀咖啡；週三公休。", q: "柴山1號海洋咖啡"}
      - name: 海景餐廳
        cat: food
        items:
          - {zh: "新濱町海洋廚房", en: "Shinhamacho Cuisine Hub", addr: "鼓山區濱海一路109-1號", mrt: [O1, C14], exit: "西子灣站1號出口步行約 7 分鐘", hours: ["每日 12:00–22:00（部分店家 20:30 收）"], tel: "07 213 6612", note: "前鼓山魚市場改建，2025 年 3 月開幕，十幾家餐飲進駐。"}

  - id: art
    title: 藝
    lead: 駁二倉庫群加幾間館舍，大多在輕軌 C12–C14 之間。
    groups:
      - name: 藝文館舍
        cat: art
        items:
          - {zh: "駁二藝術特區", en: "The Pier-2 Art Center", addr: "鹽埕區大勇路1號", mrt: [O2, C12, C13], exit: "鹽埕埔站1號出口（大勇倉庫）；輕軌駁二大義站、駁二蓬萊站", hours: ["週一至週四 10:00–18:00", "週五至週日及國定假日 10:00–20:00"], tel: "07 521 4899", note: "大勇、大義、蓬萊三區倉庫群。戶外廣場隨時可逛，各展館時間以展覽為準；除夕休館。"}
          - {zh: "棧貳庫 KW2", en: "KW2", addr: "鼓山區蓬萊路17號", mrt: [O1, C13, C14], exit: "西子灣站2號出口；輕軌駁二蓬萊站", hours: ["週日至週四 10:00–21:00", "週五、週六及國定假日 10:00–22:00"], tel: "07 531 8568", note: "百年糖倉改成的商場。官網有旗津渡輪與文化遊艇資訊。"}
          - {zh: "高雄市立歷史博物館", en: "Kaohsiung Museum of History", addr: "鹽埕區中正四路272號", mrt: [O2], exit: "2號出口", hours: ["週二至週日 09:00–17:00"], tel: "07 531 2560", note: "前身是日治時期的高雄市役所；週一、除夕休館。"}
          - {zh: "哈瑪星台灣鐵道館", en: "Hamasen Museum of Taiwan Railway", addr: "鼓山區蓬萊路99號（駁二蓬萊B7、B8倉庫）", mrt: [C13, O1], exit: "輕軌駁二蓬萊站；西子灣站2號出口", hours: ["週四至週二 10:00–18:00（17:30 停售票）"], tel: "07 521 8900", note: "週三休館。2026/9/1 起 B8 倉庫換展關閉，B7 模型展與駁二小火車照開；重開日期出發前查官網。"}
          - {zh: "舊打狗驛故事館", en: "Old Takao Station Story Hall", addr: "鼓山區鼓山一路32號", mrt: [O1, C14], exit: "西子灣站1號出口；輕軌哈瑪星站", hours: ["週二至週日 10:00–18:00"], tel: "07 531 6209", note: "高雄港站舊址，縱貫鐵路南端的起點；週一休館。", q: "舊打狗驛故事館"}
          - {zh: "金馬賓館當代美術館", en: "ALIEN Art Centre", addr: "鼓山區鼓山一路111號", mrt: [C15], exit: "輕軌壽山公園站", hours: ["週二至週日 10:00–18:00"], tel: "07 972 1685", note: "要買票，票價查官網；週一休館。"}

  - id: sight
    title: 景
    lead: 哈瑪星的日治時期老建築與鐵道遺跡。
    groups:
      - name: 景點
        cat: sight
        items:
          - {zh: "打狗英國領事館文化園區", en: "Former British Consulate at Takao", addr: "鼓山區蓮海路20號", mrt: [O1], exit: "西子灣站2號出口轉橘1或99公車", hours: ["週一、週二、週四、週五 10:00–19:00", "週六、週日及國定假日 09:00–19:00"], tel: "07 525 0100", note: "週三休館（遇國定假日照開）；18:30 停止售票。山上入口在蓮海路20號，山下入口在哨船街7號。"}
          - {zh: "武德殿", en: "Kaohsiung Butokuden", addr: "鼓山區登山街36號", mrt: [O1, C14], exit: "西子灣站1號出口步行約 10 分鐘", hours: ["週二至週日 10:00–18:00"], tel: "07 531 7382", note: "日治時期的武道場，免費參觀。週一休館（資料來自高雄旅遊網，出發前再確認）。從登山街進去要走一小段階梯。"}
          - {zh: "哈瑪星代天宮", en: "Hamasen Daitian Temple", addr: "鼓山區鼓波街27號", mrt: [O1, C14], note: "哈瑪星的廟口，主祀五府千歲。周邊是汕頭麵、魚丸、碗粿等小吃。"}
          - {zh: "哈瑪星鐵道文化園區", en: "Hamasen Railway Cultural Park", addr: "鼓山區鼓山一路32號", mrt: [C14, O1], exit: "輕軌哈瑪星站；西子灣站1號出口", hours: ["戶外園區全天開放"], note: "舊鐵道、倉庫連到打狗驛的戶外園區；館內展覽看台灣鐵道館與舊打狗驛故事館各自的時間。", q: "哈瑪星鐵道園區"}

  - id: port
    title: 港
    lead: 駁二到哈瑪星沿著港邊走。
