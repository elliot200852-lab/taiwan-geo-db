          - {zh: "壽山動物園", en: "Shoushan Zoo", addr: "鼓山區萬壽路350號", mrt: [O2, C16], exit: "鹽埕埔站4號出口，在華南銀行前站牌搭 56 路公車；輕軌文武聖殿站也可轉 56 路", hours: ["週二至週日 09:00–17:00"], tel: "07 521 5187", note: "週一休園，門票 40 元。"}
          - {zh: "壽山情人觀景台", en: "Shoushan Lovers' Viewing Platform", addr: "鼓山區忠義路30號", hours: ["24 小時開放"], note: "在忠烈祠旁的山路上，看高雄市區與港口。路窄坡陡，夜間開車要小心；公車與接駁出發前查高雄公車動態。", q: "壽山情人觀景台"}

