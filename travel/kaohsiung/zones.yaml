# 旅遊地圖・高雄市 分區規劃（一區一個 yaml，一區做完上線再做下一區）
# 執行一區：python3 scripts/travel.py new kh-02   → 產出骨架 travel/kaohsiung/kh-02-*.yaml（照下面 scope 填）
#           填完資料 → python3 scripts/travel.py geocode kh-02 → python3 scripts/travel.py build → commit＋push（CI 自動上線）
# status：done＝已上線｜next＝建議下一個｜planned＝排隊中
# 每區產出比照第 1 區：食（在地小吃／餐廳）・樂（逛街）・態（自然）・藝（館舍）・景（地標）・港（水岸），
# 每筆含地址、營業時間、電話、鄰近捷運／輕軌站與出口；另附「雨天備案」與「交通怎麼到」。
# 資料一律查官方網站／Google 商家頁核對營業時間，查不到的欄位留空，不要猜。

city: 高雄市
city_id: kaohsiung
city_en: Kaohsiung
intro: 從比歐緻居房內的散步地圖出發，把高雄按「搭捷運能一天逛完」的範圍切成 14 區。

zones:
  - id: kh-01
    order: 1
    name: 中央公園站散步圈
    districts: [新興區, 前金區, 苓雅區]
    status: done
    stations: [R9]
    scope: 捷運 R9 中央公園站周邊步行圈＋摺頁列的全市食樂態藝景港、雨天備案、捷運圖。
    file: kh-01-central-park.yaml

  - id: kh-02
    slug: hamasen
    order: 2
    name: 鹽埕・哈瑪星・駁二
    districts: [鹽埕區, 鼓山區（南段）]
    status: next
    stations: [O1, O2, C11, C12, C13, C14, C15]
    scope: 駁二藝術特區、大港橋、棧貳庫、高雄流行音樂中心、哈瑪星鐵道文化園區、舊打狗驛、武德殿、代天宮、新濱碼頭、打狗英國領事館、西子灣、壽山（動物園、情人觀景台）、鹽埕老店（三郎餐包、鴨肉珍、阿綿麻糬、港園牛肉麵本店）、高雄市立歷史博物館。
    note: 第 1 區「全市導覽」已列不少這區的點，搬過來後補在地小吃與步行路線。

  - id: kh-03
    slug: cijin
    order: 3
    name: 旗津
    districts: [旗津區]
    status: planned
    stations: [O1, C14]
    scope: 鼓山輪渡站／棧貳庫渡輪過去；旗津老街與海產街、天后宮、旗後燈塔、旗後砲台、星空隧道、彩虹教堂、海水浴場、風車公園、腳踏車路線、渡輪時刻與票價。

  - id: kh-04
    slug: art-museum
    order: 4
