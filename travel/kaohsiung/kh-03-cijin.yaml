        note: 渡輪站前與海岸公園門口一帶還有私人出租店，店名地址電話沒能查證，這裡不列。下面是公共自行車站，座標與站址取自 OpenStreetMap（2020–2021 登錄），可用一卡通、悠遊卡或手機，租金依 YouBike 官網。
        items:
          - zh: YouBike 旗津海水浴場站
            addr: 旗津區發祥街4-2號
            hours: [24 小時]
            ll: [22.61079, 120.26758]
          - zh: YouBike 旗津貝殼館站
            addr: 旗津區旗津三路990號（東南側停車場）
            hours: [24 小時]
            ll: [22.60076, 120.27464]
          - zh: YouBike 旗津海岸公園停車場站
            addr: 旗津區旗津三路／中洲三路687巷（西側）
            hours: [24 小時]
            ll: [22.60899, 120.26898]
          - zh: YouBike 旗津漁港公有停車場站
            addr: 旗津區北汕巷50號（東南側廣場）
            hours: [24 小時]
            ll: [22.58977, 120.28719]

  - id: ferry
    title: 渡輪時刻與票價
    lead: 資料抄自高雄市輪船股份有限公司官網（網頁更新 2026-10-24），時刻與票價是官網貼的圖，2026-10-27 逐項抄錄。班船受水流、氣候、航道船隻影響，時間只供參考。
    groups:
      - name: 鼓山 ⇄ 旗津（旗鼓航線，每日往返）
        cat: info
        items:
          - zh: 班次（平日）
            hours:
              - 05:00–06:00　約每 30 分鐘一班（鼓山發 05:15、05:45、06:05；旗津發 05:00、05:30、06:00）
              - 06:40–08:30　約每 6–8 分鐘一班
              - 08:30–09:50　約每 8–12 分鐘一班
              - 09:50–16:10　約每 12–15 分鐘一班
              - 16:10–20:00　約每 8–12 分鐘一班
              - 20:00–23:55　約每 12–15 分鐘一班
              - 23:55–02:00　約每 30 分鐘一班（鼓山發 24:00、00:30、01:00、01:30、02:00；旗津發 00:15、00:45、01:15、01:45、02:00）
            note: 首班 05:00（旗津發），末班 02:00。時刻圖上 06:00–06:40 沒有列，照原圖抄。
          - zh: 班次（假日）
            hours:
              - 05:00–06:00　約每 30 分鐘一班（鼓山發 05:15、05:45、06:05；旗津發 05:00、05:30、06:00）
              - 06:00–08:20　約每 12–15 分鐘一班
              - 08:20–12:20　約每 8–12 分鐘一班
              - 12:20–19:40　約每 6–8 分鐘一班
              - 19:40–21:00　約每 8–12 分鐘一班
              - 21:00–23:55　約每 12–15 分鐘一班
              - 23:55–02:00　約每 30 分鐘一班（鼓山發 24:00、00:30、01:00、01:30、02:00；旗津發 00:15、00:45、01:15、01:45、02:00）
            note: 航程約 5–10 分鐘。連假時排隊人潮可能很長。
          - zh: 票價（現金、電子票證）
            hours:
              - 行人或後座乘客　全票 30、學生票 25、優待票 15
              - 騎士＋機車　現金全票 60、學生 55、優待 45（電子票證同價：60／55／45）
              - 騎士＋自行車　全票 40、學生 35、優待 25
              - 機車雙載 90、自行車（不含騎士）10
              - 大型重機（紅牌、黃牌）100，含 1 騎士 1 重機，僅收現金
            note: 優待票限 6–12 歲、65 歲以上、身心障礙者及 1 名必要陪伴者，要出示證件。6 歲以下或 115 公分以下免費。機關團體帶三位幼童以一張全票計。
          - zh: 付款方式
            hours:
              - 一卡通、悠遊卡、icash 2.0 刷卡
              - 一卡通 MONEY、悠遊付、icash Pay 乘車碼
              - 現金投幣，不找零，自備零錢
            note: 設籍旗津區居民持旗津卡免費。博愛卡、陪同卡要先刷主卡再刷附卡，且兩張在同一台機器上刷。
          - zh: 連假機車管制
            note: 遇三天以上連假，每日 11:00–19:00 遊客的燃油機車禁止登船。居民、電動機車、自行車及公務人員不受限。
          - zh: 資料出處
            note: 高雄市輪船股份有限公司「鼓山-旗津航線」https://kcs.kcg.gov.tw/Content_List.aspx?n=2EDF685BBC9D2857（網頁更新 2026-10-24；時刻與票價圖，2026-10-27 查證）。官網文字只寫優惠條件，金額取自官網貼的票價圖。
      - name: 棧貳庫 ⇄ 旗津（海上巴士）
        cat: info
        items:
          - zh: 班次
            hours:
              - 平日（週一至五）12:30–16:15
              - 假日（週六、日及例假日）12:00–18:45
              - 棧貳庫發：每小時 00 分、30 分（12:00 起，到 16:00／假日到 18:30）
              - 旗津發：每小時 15 分、45 分（12:15 起，到 16:15／假日到 18:45）
            note: 官網頁面寫每日開航。同一份時刻表圖是 hololive 聯名版，圖上另印「2026 年 7 月 28 日起每週五、六、日、一、二」，主題船型依當日營運為準，兩種寫法並存，出發前打 07 226 2888 確認。圖上 12:00、16:30 以後的班只有假日。
          - zh: 票價
            hours:
              - 全票 80
              - 優待票 40（6–12 歲、65 歲以上、身心障礙者及必要陪伴者 1 人）
              - 6 歲以下免費，乘船時主動告知工作人員
            note: 付款方式同旗鼓航線，現金不找零。登船處是棧貳庫海側廣場與旗津輪渡站第 2 候船室。
          - zh: 資料出處
            note: 高雄市輪船股份有限公司「棧貳庫-旗津航線【海上巴士】」https://kcs.kcg.gov.tw/Content_List.aspx?n=6DA8A39BB8402A6D（網頁更新 2026-10-24；時刻表圖，2026-10-27 查證）。官網沒有另列單車、機車是否可上這條船，查不到不寫。

  - id: bike
    title: 腳踏車路線
    lead: 單車可以直接騎上旗鼓航線的船（10 元），上岸就能騎。
    groups:
      - name: 旗津單車道
        cat: info
        items:
          - zh: 推薦路線：渡輪站 → 旗後山 → 海岸公園 → 風車公園
            hours:
              - 旗津輪渡站、廟前路老街、天后宮
              - 旗後山：星空隧道、旗後砲台、高雄燈塔（山上走步道，禁汽機車）
              - 旗津海水浴場
              - 旗津海岸公園：海珍珠、彩虹教堂、貝殼館
              - 旗津三路往南到風車公園、戰爭與和平紀念公園
            note: 路線長度各來源說法不同：15.5 公里（市府新聞說法）、17 公里（渡輪站到海岸線、街道線一圈）、23.4 公里（含南段到區公所與和平公園），官方入口網原頁沒查到，這裡不下定論。路平坦，海邊風大。
          - zh: 租車與還車
            note: 出渡輪站就有一整排出租店，旗津三路與海岸公園門口一帶也有。價格各店不同，查不到可靠的現行價，現場問清楚。YouBike 站見上方「腳踏車租借點」。

