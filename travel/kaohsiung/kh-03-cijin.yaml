    title: 雨天備案
    lead: 旗津室內可去的只查到這兩處，都免費。下雨天也可以搭船回鼓山那頭逛駁二。
    groups:
      - name: 雨天備案
        cat: rain
        items:
          - zh: 旗津貝殼館
            en: Cijin Shell Museum
            addr: 旗津區旗津三路887號
            hours: [週二至週日 09:00–17:00（週一休館，遇連假開放）]
            tel: 07 571 8920
          - zh: 戰爭與和平紀念公園主題館
            en: War and Peace Memorial Park Museum
            addr: 旗津區旗津二路701號
            hours: [週二至週日 10:00–18:00（週一休館，遇國定假日開館）]
            tel: 07 571 9973

