# 旅遊地圖・高雄市・第 3 區：旗津
# 範圍（zones.yaml）：鼓山輪渡站／棧貳庫渡輪過去；旗津老街與海產街、天后宮、旗後燈塔、旗後砲台、星空隧道、彩虹教堂、海水浴場、風車公園、腳踏車路線、渡輪時刻與票價。
# 欄位同 kh-01-central-park.yaml；查不到的欄位留空，不要猜。營業時間以官網／Google 商家頁核對。
# 查證方式（2026-10-27）：渡輪時刻、票價、站址電話抄自高雄市輪船公司官網（kcs.kcg.gov.tw，頁面更新 2026-10-24）的時刻與票價圖；
#   戰爭與和平紀念公園抄自館方官網；高雄燈塔時間依交通部航港局 2023-03-31 公告；站點座標取自 OpenStreetMap。
#   小吃店與海產店沒有官網，電話營業時間各報導互相矛盾的欄位一律留空，note 寫明。
id: kh-03
city: 高雄市
city_id: kaohsiung
order: 3
name: 旗津
subtitle: 旗津區｜鼓山輪渡站搭船過島，老街、旗後山、海岸公園、風車公園一線
districts: [旗津區]
center: [22.6020, 120.2755]
zoom: 14
source: 高雄市輪船公司官網（渡輪）、戰爭與和平紀念公園官網、交通部航港局公告、OpenStreetMap，並以媒體與部落格交叉核對，2026-10-27 查證
updated: 2026-10-27

sections:
  - id: food
    title: 食
    lead: 旗津的吃集中在廟前路與通山路（老街）。小吃店多是個人攤，營業日常變，各報導說法不一的時間與電話這裡留空，出發前打電話或看店家社群。
    groups:
      - name: 老街小吃
        cat: snack
        items:
          - zh: 湯生潮州餛飩麵
            addr: 旗津區廟前路113號
            hours: [06:00–15:00（週一休息）]
            tel: 07 571 9271
            note: 開在天后宮正前方的老店。時間與電話出自舊報導，先確認再去。
          - zh: 不一樣赤肉羹（廟前店）
            addr: 旗津區廟前路56號
            hours: [10:00–19:00（週五至週日到 20:00）]
            note: 電話各報導不同（有手機有市話），這裡不列。中洲三路另有創始店。
          - zh: 胡椒手工魚麵店
            addr: 旗津區通山路44號
            note: 營業日各報導不一（週末營業、週二休、週二至四休都有），電話也不一致，先打聽再去。
          - zh: 椪嫂蕃薯椪
            addr: 旗津區通山路40號
            tel: 0930 838 397
            note: 下午才開，現炸賣完收攤，營業時間與公休日各報導不同，趕早不趕晚。
          - zh: 旗津蕃茄切盤
            addr: 旗津區廟前路
            q: 蕃茄切盤 旗津
            note: 老街上有好幾家，門牌各來源寫法不同（35 號、70 號都有），沿街看招牌。
          - zh: 炭烤小卷
            addr: 旗津區廟前路
            q: 老字號烤小卷 旗津
            hours: [11:00 起，賣完為止]
            note: 老街上賣烤小卷、烤魷魚的攤不只一家。門牌報導寫廟前路 11 號，地圖資料登在 9 號，沿街找招牌。
          - zh: 斗六冰城（旗津創始店）
            addr: 旗津區中洲三路450號
            tel: 07 571 3850
            note: 離老街不到一公里，騎單車順路。營業時間各來源不同，留空。
      - name: 海產街・活海產
        cat: food
        items:
          - zh: 旗津海產街
            addr: 旗津區廟前路
            q: 廟前路 旗津區 高雄市
            note: 廟前路兩側一整排活海產店，秤斤點菜。價格先問清楚再點。
          - zh: 海忠寶活海產
            addr: 旗津區廟前路66號
            tel: 07 572 1658
            note: 營業時間只查到舊報導，留空。
          - zh: 旗后活海產
            addr: 旗津區廟前路31號
            note: 只查到店名地址，電話與時間查無，到現場問。
          - zh: 海味鮮活海產
            addr: 旗津區廟前路75號
            note: 只查到店名地址，電話與時間查無，到現場問。

  - id: play
    title: 樂・態・藝・景・港
    lead: 上岸往右是旗後山（燈塔、砲台、星空隧道），往左順旗津三路走是海水浴場、海岸公園，再往南是風車公園。
    groups:
      - name: 景點
        cat: sight
        items:
          - zh: 旗津老街
            en: Cijin Old Street
            addr: 旗津區廟前路
            q: 旗津老街
            note: 出旗津渡輪站就是。各店時間不同，下午到傍晚最熱鬧。
          - zh: 旗津天后宮
            en: Cijin Tianhou Temple
            addr: 旗津區廟前路93號
            hours: [每日 06:00–21:00]
            tel: 07 571 2115
            note: 市定古蹟，相傳創建於 1673 年。
          - zh: 旗後砲台
            en: Cihou Fort
            addr: 旗津區旗後山
            q: 旗後砲台
            hours: [全天開放]
            note: 國定古蹟，免費。從天后宮、星空隧道走步道上山，建議白天上去。
          - zh: 高雄燈塔（旗後燈塔）
            en: Kaohsiung Lighthouse
            addr: 旗津區旗下巷34號
            hours: [每日 10:00–21:00]
            tel: 07 571 5021
            ll: [22.61517, 120.26497]
            note: 免費，晚上也開放。2023 年 4 月起取消週一休園（航港局公告）。山上步道禁汽機車。
          - zh: 星空隧道
            en: Star Tunnel
            addr: 旗津區廟前路1巷
            q: 星空隧道 旗津
            hours: [24 小時開放（燈光約 05:00–24:00）]
            note: 通往旗後山的步行隧道，走到砲台只要幾分鐘。
          - zh: 旗津彩虹教堂
            en: Cijin Rainbow Church
            addr: 旗津區旗津三路990號
            hours: [每日 06:00–16:00]
            note: 在旗津海岸公園內。傍晚（約 16:00–18:30）常有婚紗拍攝，不一定能進去。
      - name: 藝文
        cat: art
        items:
          - zh: 旗津貝殼館
            en: Cijin Shell Museum
            addr: 旗津區旗津三路887號
            hours: [週二至週日 09:00–17:00（週一休館，遇連假開放）]
            tel: 07 571 8920
            note: 免費入館，館外就是海岸公園。
          - zh: 戰爭與和平紀念公園主題館
            en: War and Peace Memorial Park Museum
            addr: 旗津區旗津二路701號
            hours: [週二至週日 10:00–18:00（週一休館，遇國定假日開館）]
            tel: 07 571 9973
            note: 免費，可預約導覽。在風車公園旁。
      - name: 自然
        cat: eco
        items:
          - zh: 旗津海水浴場
            en: Cijin Beach
            addr: 旗津區廟前路1號
            q: 旗津海水浴場
            hours: [部落格寫每年 4–10 月 09:00–18:00]
            note: 整體改造工程預計 2026 年底完工，施工期間部分區域可能圍起，下水前看現場公告。
          - zh: 旗津海岸公園
            en: Cijin Coastal Park
            addr: 旗津區旗津三路
            q: 旗津海岸公園
            note: 彩虹教堂、貝殼館、金色貝殼「海珍珠」都在這一帶，傍晚看夕陽。
          - zh: 旗津風車公園
            en: Cijin Windmill Park
            addr: 旗津區旗津二路
            q: 旗津風車公園
            note: 公園內有黃色三葉式風車。在島的南段，單車道騎過來，旁邊是戰爭與和平紀念公園。
      - name: 港・水岸
        cat: port
        items:
          - zh: 鼓山輪渡站（西子灣）
            en: Gushan Ferry Station
            addr: 鼓山區濱海二路1號
            mrt: [O1, C14]
            exit: 西子灣站1號出口；輕軌哈瑪星站
            hours: [船班約 05:00–02:00，時刻見「渡輪時刻與票價」]
            tel: 07 571 2542
            note: 站舍整建中，原電話 07 551 4316 請改撥 07 571 2542（官網公告）。
            q: 鼓山輪渡站
          - zh: 旗津渡輪站
            en: Cijin Ferry Station
            addr: 旗津區海岸路10號
            hours: [船班約 05:00–02:00，時刻見「渡輪時刻與票價」]
            tel: 07 571 2542
            note: 棧貳庫海上巴士在這裡的第 2 候船室上船。
            q: 旗津輪渡站
          - zh: 棧貳庫渡輪站（海側廣場）
            en: KW2 Ferry Station
            addr: 鼓山區蓬萊路17號海側廣場
            mrt: [C13, C14]
            exit: 輕軌駁二蓬萊站、哈瑪星站
            hours: [平日 12:30–16:15, 假日 12:00–18:45（海上巴士，詳見渡輪時刻）]
            tel: 07 226 2888
            note: 電話是高雄輪船公司辦公室（週一至週五 08:00–12:00、13:30–17:30）。
            q: 棧貳庫

      - name: 腳踏車租借點（YouBike 2.0）
