new-taipei-wulai: "A deep, steep-walled mountain river valley where a tall white waterfall plunges from a hanging side valley down a cliff face, faint steam rising from hot-spring pools along the boulder-strewn riverbed, and a small settlement clinging to the narrow valley floor where two rivers meet"
new-taipei-tamsui: "A river-port town climbing five low finger-like ridges above a broad river mouth, narrow stepped lanes rising between the spurs, sandbars and mangrove-fringed tidal flats along the shore, and a single graceful mountain rising across the wide estuary"
new-taipei-bali: "A long narrow ribbon of sandy flat land pinned between a great lone mountain behind and a wide river mouth in front, ending in a curved sand spit that hooks around a calm lagoon-like tidal flat of mangroves and mudbanks"
new-taipei-jinshan: "A sulfur-yellowed stream winding down from steaming volcanic hills through a small green valley to the sea, a fishing harbor sheltered in the lee of a bold sandstone headland, and twin candlestick-shaped sea stacks standing just offshore at the cape's tip"
