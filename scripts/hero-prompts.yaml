hualien-guangfu: "A broad gravel alluvial fan spreading out from a mountain gorge mouth, giving way at its lower edge to a spring-fed green marsh laced with narrow clear water channels and reed beds, bundles of bamboo poles woven into simple layered fish-trap structures standing in the shallow water"
hualien-fengbin: "A rugged natural wave-cut rock platform rising from the sea in a few broad irregular tiers, its uneven weathered surface pocked with scattered round potholes of many different sizes (natural erosion, no straight joints, no grid pattern, not masonry, not paving), one flank sloping gently seaward while the other drops as a sharp cliff into crashing surf, steep green mountain slopes close behind the shore"
hualien-ruisui: "A flat-topped highland tableland capped in rust-red weathered soil, rows of betel palms standing across its level surface, and beyond its edge a broad gentle river bending sharply to squeeze between two steep forested ridges where its wide valley narrows abruptly into a tight gorge"
hualien-yuli: "An old riveted steel truss railway bridge crossing a wide pale gravel riverbed, its deck visibly buckled and stepped out of alignment mid-span where one half sits noticeably higher than the other, layered mountain ranges standing on both sides of the broad dry stone valley"
hualien-zhuoxi: "A high jagged rocky mountain summit rising above dense stands of acorn-laden oak trees on a steep slope, and far below in the valley a wide dry riverbed of bare grey stones where the water has vanished beneath the gravel, no coastline, no town, only forested ridges in every direction"
hualien-fuli: "A gentle green hillside terrace dotted with several small low grey mud cones and shallow puddles where thick mud slowly domes and bubbles (cold mud, no fire, no smoke, no lava), a bare cracked grey mudflat surrounding the vents where no plants grow, and below in the valley a patchwork of bright green rice paddies stretching toward distant mountains"

# ── 臺東 16 鄉鎮頁（2026-08-08）──
taitung-changbin: "A sheer coastal cliff with a dozen or so irregular natural sea-cave mouths of varied size and shape scattered at different heights up its face — the lowest near sea level, others stranded far above (uplifted ancient sea caves, weathered and uneven, never uniform rows of carved holes) — a pale band of coral rock embedded partway up the cliff, lush subtropical vegetation clinging to ledges, and below the cliff a narrow coastal shelf of stepped rice terraces running the short distance to the Pacific"
taitung-chishang: "A raised irrigation canal running along the crest of a long earthen embankment standing higher than the surrounding fields, its water visibly flowing above the level of the flat rice paddies on either side, an endless mirror-flat valley of green paddies stretching toward layered mountains on both sides with no visible slope in any direction"
taitung-haiduan: "A shallow oval alpine tarn lying in a smooth grassy saucer high on a bare ridge — gentle rolling slopes of short golden-green alpine grass curving down to the waterline on every side, no rocky cliff wall, no snow, no trees at this elevation, the still water mirroring the sky like a teardrop; soft rounded ridgelines with scattered low creeping juniper, and far beyond, a deep forested river gorge dropping toward a narrow valley"
taitung-guanshan: "An old wooden train station with a two-tiered Mansard-style hip roof standing at the corner of a perfectly gridded small Taiwanese country town — straight streets lined with rows of low two-storey brick-and-timber shophouses whose continuous street-level arcades and tiled roofs join wall to wall — a broad dry gravel riverbed scattered with pale round stones stretching past the rooftops toward layered mountains on both sides of the valley"
taitung-luye: "A wide, level river-terrace plateau standing high above the valley floor, its flat grassy surface breaking off in an abrupt terraced cliff edge, a hot-air balloon lifting off from the open tableland at dawn, a paragliding wing riding the rising air along the terrace's steep edge, layered tea rows and betel palms on the lower terrace steps below, two long mountain ranges enclosing the wide rift valley in the distance"
taitung-yanping: "A dense low-elevation broadleaf forest where a single sprawling banyan tree has grown into a wide flat canopy on thick aerial roots that have fused into a horizontal maze of trunks and walkways just above the forest floor (a wide 'walking tree', not one vertical trunk), narrow shafts of light filtering through the leaf canopy, a steep river gorge with a suspension footbridge visible through a gap in the foliage, misty mountains beyond"
taitung-chenggong: "A sturdy motorized Taiwanese harpoon fishing boat, no sails, with a long triangular harpoon platform jutting from its bow, a lone small silhouetted figure braced at the platform's tip scanning choppy wind-whipped subtropical seas (distant, faceless), and in the distance a distinctive offshore islet of three humped rocky volcanic peaks joined to the green coast by a long low footbridge of many small arches"
taitung-donghe: "A small rocky island just offshore linked to the mainland by a low sandy ridge barely breaking the surface of the water, waves curving in from both sides and meeting where the sand bridge is still forming, a narrow gorge further inland where a river has sliced clean through the middle of a coastal mountain range, steep forested walls rising on both sides of the cut"
taitung-taitung: "An arrow-straight strip of open green parkland where a dead-end railway line once ran directly into the heart of a low grid-planned city, old rail platforms, a roundhouse turntable and abandoned rail sheds preserved along the corridor amid market stalls and open-air music stages, a single low isolated hill visible in the near distance rising from the flat delta plain, and a wide river mouth opening to the Pacific beyond the rooftops"
taitung-beinan: "A river valley where two utterly different cliffs face each other across the water: on one bank a badland cliff of smooth grey-black mudstone eroded into sharp knife-edge ridges and dense rain gullies with no vegetation, scattered oddly-shaped boulders embedded loose in its soft matrix; on the opposite bank a tall bluff of coarse rounded river-cobble conglomerate, pale and equally bare of plants, the pebbles clearly visible embedded in its cliff face, a wide braided gravel riverbed running between the two"
taitung-taimali: "A chain of small fan-shaped hamlets strung along a straight steep coastline at the immediate foot of the Central Mountain Range, each settlement sitting on its own gravel fan where a short steep river spills from the mountains, low bare hillside dropping straight to the sea between the fans where no river reaches, the sun rising directly out of the open Pacific horizon at the shore's edge"
taitung-jinfeng: "A cluster of stone-slab houses freshly rebuilt in the old technique, low walls of flat grey stone stacked without mortar, perched on a narrow terrace on a steep, densely forested mountainside that plunges toward a deep river gorge far below, a thin waterfall dropping from a hanging tributary valley on the far slope, heavy monsoon cloud clinging to the upper ridgeline"
taitung-dawu: "A small fishing harbor tucked at the foot of the rapidly lowering tail of the Central Mountain Range, its narrow mouth choked by a pale sand bar despite long twin breakwaters reaching into the surf, heat-shimmer haze rising over a coastal highway squeezed onto a narrow shelf between cliff and sea, and the dark round mouth of a railway tunnel opening directly onto that same narrow coastal strip"
taitung-daren: "A wild, roadless stretch of subtropical coastline where steep mountain slopes covered in dense low green scrub, screw-pine and wind-pruned coastal forest (no tall conifers) drop straight into the Pacific with no flat land between, a beach made entirely of smooth, well-rounded fist-sized pebbles in muted grey and white tones (no sand), waves rolling the stones, and no trace of any road, building, or path along the entire shore"
taitung-ludao: "A rugged volcanic island shore at dawn seen from along the coast — a sweeping intertidal reef platform of dark pitted rock, three round hot-spring pools rimmed with low stone walls set right in the tidal zone, wisps of steam drifting off their pale blue water toward the open Pacific, jagged weathered volcanic pinnacles rising along the skyline behind the bay, white surf breaking on the reef edge, warm early light on the wet rock"
taitung-lanyu: "A traditional half-sunken house set into a shallow excavated pit on a grassy slope, its low thatched roof barely rising above ground level, a raised open wooden platform standing on stilts beside it, a narrow band of stepped flat marine-terrace ground running along the coastline below with small garden plots, a slender wooden boat resting on the shore far in the distance, and layered cloud-wrapped volcanic peaks rising behind"

# ── 高雄 12 鄉鎮頁（2026-08-09 KH-S1 前半）──
kaohsiung-gushan: "A steep limestone ridge rising abruptly above a dense harbor city, its rock face deeply pitted and grooved by centuries of rain into sharp jagged karst ridges, fissures and hollows, the cliff dropping straight down to a narrow strait shoreline scattered with reef rock, small distant silhouettes of macaques perched high on the ledges, dense low rooftops crowding the flat land at the mountain's foot beside a sheltered harbor bay"
kaohsiung-qiaotou: "A flat sugarcane plain stretching to a low horizon, a tall brick factory chimney and cluster of red-brick industrial sheds rising at its center, a narrow-gauge rail track running dead straight across the cane rows toward the chimney, a slow shallow irrigation canal threading along the field's edge under a wide open sky"
kaohsiung-namaxia: "A wide gravel-bedded mountain river winding through a steep forested valley, coarse pale boulders filling a broad braided channel with an undercut bank carved on the outer curve, stacked river-terrace platforms on the inner bank holding small clustered wooden village houses among betel palms, layered misty peaks rising close on both sides"
kaohsiung-yancheng: "Street-level view down a grid of old shophouse streets on completely flat ground, weathered two-storey storefronts with arcaded walkways lining both sides, a quiet river mouth with a low bridge visible at the end of one street and harbor cranes far beyond it, the dense rooftops of the city continuing unbroken behind and to the sides into the distance, no wall and no island, one green forested hill rising far away across the water on the horizon"
kaohsiung-yanchao: "A cluster of small cone-shaped mud mounds standing on a bare grey-white badland ridge (cold grey mud, no fire, no smoke, no lava), thick mud slowly bubbling from a narrow pit at the tip of the tallest cone and sliding down its steep flank in a tongue-shaped flow, the surrounding slopes deeply gullied and cracked, dry orchard rows visible on the gentler badland fringe beyond"
kaohsiung-ziguan: "A small fishing harbor at first light, rows of low wooden near-shore fishing boats crowded along a narrow stone quay, distant small silhouettes unloading baskets at the dock, a slender lighthouse standing at the tip of a breakwater, a dead-flat coastal plain of vegetable fields stretching inland behind the port with no hill anywhere on the horizon"
kaohsiung-qianzhen: "A flat harbor-side plain split between two working waterfronts side by side, tall gantry cranes and stacked shipping containers lining one broad quay, a row of large ocean-going trawlers moored at a nearby wharf with small distant figures unloading catch, a calm tidal river mouth threading past reclaimed flat land toward the harbor water, no hill or high ground anywhere"
kaohsiung-dashu: "A row of riveted steel truss bridge spans striding across a vast pale gravel riverbed, a wide braided river threading a few thin channels between exposed stone bars, terraced orchard rows climbing a low reddish laterite river-terrace bluff on the near bank above the water"
kaohsiung-maolin: "A river gorge where a fast mountain river bends into a tight hairpin loop, almost fully encircling a tall isolated forested hill that stands like an island against the current, a narrow notch of dry former channel visible at the loop's neck where the river once wrapped around the far side, sheer cliffs plunging into the water on the outer bank, layered green mountains rising steeply beyond"
kaohsiung-xinxing: "A wide traffic roundabout at the heart of a flat, dense old city quarter, streets radiating outward from the circle lined with low shophouse rooftops and narrow arcaded lanes, a completely level plain stretching in every direction with no hill or slope in sight, a narrow covered canal running along the district's edge"
kaohsiung-mituo: "A low, pale grey-white barren mudstone hill rising abruptly from a dead-flat coastal plain, its bare slopes deeply grooved and gullied by rain with almost no vegetation, a checkerboard of square fish ponds mirroring the sky spreading out below the hill toward a hazy strait horizon"
kaohsiung-liugui: "A cluster of steep, near-vertical conglomerate rock peaks rising in a row along a river valley, their cliff faces textured with rounded river-pebbles cemented in layers and cut into narrow independent spires by rain, a wide braided gravel river curving at their base, layered forested mountains standing behind"

# ── 高雄 12 鄉鎮頁（KH-S2）──
kaohsiung-nanzi: "A long asymmetric limestone ridge with one entire flank sheared away into stepped quarry terraces, exposing pale rock bands above a small crescent lake pooled in the old mining pit at its foot, a cluster of tall industrial silos and pipe racks standing on the flat plain beyond, distant chimney stacks of a decommissioned refinery site, dense flat rooftops filling the rest of the plain, no other hill in sight"
kaohsiung-luzhu: "A dead-flat farming plain stretching to every horizon with no hill or slope anywhere, a scatter of old brick farmhouse clusters linked by narrow field paths, rows of low plastic-and-net tomato greenhouses standing beside open vegetable fields, a straight modern factory building with a wide car park rising abruptly among the same flat fields, a dry irrigation pond edge visible nearby"
kaohsiung-qijin: "A long thin sand spit sheared cleanly in two by a wide artificial harbor channel cut straight through it, small ferry-boat silhouettes crossing the gap between the severed ends, low sand dunes and windbreak trees running along the spit's ridge, a small rocky headland rising at the spit's northern tip, calm strait water on the open-sea side and tall harbor cranes on the far shore across the channel"
kaohsiung-lingya: "A grid of flat reclaimed street blocks laid directly over a former lagoon and fishing-net-shed shoreline, a straight canal-like river channel held between concrete embankments along one edge, a dense modern high-rise skyline with one very tall tower rising abruptly at the district's center, no hill or slope anywhere, distant harbor cranes visible at the flat horizon beyond"
kaohsiung-dashe: "A row of low asymmetric sandstone hills, each with one gently sloping flank and one steep eroded scarp, bare yellow-brown soil exposed on the gentler slope, orchard rows of fruit trees climbing partway up the hillside, tall industrial stacks and storage tanks of a chemical plant standing on the flat plain directly at the hill's foot, open farmland stretching away beyond"
kaohsiung-yongan: "A flat coastal wetland of abandoned salt-pan grids, low mud dikes still outlining square pools of shallow brackish water, wading water birds standing among grey mangrove shrubs at the water's edge, a checkerboard of active fish ponds spreading beside the old salt flats, tall round LNG storage tanks standing pale on the flat horizon far beyond, no hill anywhere"
kaohsiung-sanmin: "A long straight linear park of grass and young trees running like a green ribbon through the middle of a dense flat city district, low modern rooftops and street blocks lining both sides where a rail line once ran at grade, a calm river widening into two connected lake basins nearby, no hill or slope anywhere on the flat horizon"
kaohsiung-meinong: "A wide flat valley floor cupped on three sides by layered green mountain ridges, a network of narrow irrigation canals threading between checkerboard rice fields, a low U-shaped traditional courtyard farmhouse with a curved brick wall and swallow-tail roofline standing among the fields, a small stone earth-god shrine no taller than a doorway at a field's edge, a calm river winding out through a single gap in the ridges"
kaohsiung-qieding: "A narrow sand-dune ridge running along a flat coastal spit, a small stone-quay fishing harbor tucked on its inland side with low wooden boats moored close together, rows of flat golden mullet-roe drying racks laid out in open sun nearby, a wide river mouth opening to the sea at the spit's northern tip with a low bridge crossing it, salt-pan wetland pools spreading inland with wading birds"
kaohsiung-zuoying: "Close view of a long weathered coral-stone city wall with a crenellated top and an arched stone gate, the wall running along the foot of a low twin-humped limestone hill and cut clean through by a paved road with cars, its two severed ends standing on either side of the road, behind the wall a long natural lake fringed with lotus leaves and reeds stretching toward a second small hill, dense old-town rooftops pressing against the wall on the near side, a naval harbor inlet with grey warship silhouettes glimpsed far beyond"
kaohsiung-jiaxian: "A narrow river valley with stepped flat river terraces rising above a braided gravel riverbed, taro fields covering the terrace tops in neat rows, a pale sandy rock cliff face exposed along one terrace edge with small fossil shell shapes embedded in its layered stone, steep forested ridges rising close on both sides of the narrow valley"
kaohsiung-daliao: "A wide shallow braided river spreading across a pale gravel bed with no dam or weir anywhere on the calm water, red bean fields in neat rows on the flat terrace above one bank, a small flat-roofed concrete well-house standing alone at the river's edge where underground water is drawn up from beneath the gravel, low green hills rising gently on the far side of the plain"

# ── 高雄 6 鄉鎮頁（KH-S3）──
kaohsiung-qianjin: "A wide river curving in a long gentle bend through a completely flat city, its banks held by low stone embankments of equal height on both sides, a continuous tree-lined riverside promenade and green park strip following the curve along the near bank with benches and a paved path down at the water's edge, a large park of dense shade-tree canopy set back one block behind the promenade, low modest three- and four-storey city blocks filling the flat land in every direction beyond, a plain low-rise public building with a tiled roof among the trees, no dome, no monument, no tower, no hill or slope anywhere on the horizon"
kaohsiung-qishan: "A long old market street on a level terrace, continuous two-storey shophouse facades with ornate Baroque-revival gables and a covered stone-arcaded walkway running the length of both sides, the street opening at its far end onto banana groves planted in neat rows across the flat terrace top, a wide shallow river bed visible below the terrace edge beyond the groves, layered blue mountain ridges rising in tiers on the far horizon"
kaohsiung-tianliao: "A shallow valley cut into pale grey-white mudstone badlands, steep knife-edge ridges and rain-gullied slopes rising on the surrounding hillsides, a small square farm pond holding still water at the valley floor, patches of bamboo grove and a few longan trees clustered on the gentler lower slope beside the pond, two or three low tile-roofed farmhouses and a fenced vegetable patch sitting on a small flattened bench of ground at the badland's edge, a narrow dirt track winding up between the gullies toward the ridge"
kaohsiung-xiaogang: "A dead-flat coastal industrial strip seen from slightly inland, a long straight concrete wharf embankment holding back the sea with no natural shoreline in sight, rows of tall white storage tanks, tangled pipe racks and a distant factory chimney lining the waterfront, a wide paved airport runway stretching along the flat ground closer to shore with a small aircraft silhouette on its final approach, a cluster of low tightly-packed residential rooftops pressed right up against the edge of the tank farm with no buffer of green"
kaohsiung-neimen: "A narrow valley corridor winding between rounded mudstone hills thickly grown with bamboo groves on their lower slopes, a single unpaved lane threading along the valley floor past a scatter of low farmhouses toward a red-tiled temple roof with upturned eaves standing at a bend in the road, the hills closing in on every side with no distant plain visible, soft haze softening the ridgelines in the background"
kaohsiung-hunei: "A perfectly flat low-lying plain seen at eye level, a checkerboard of square fish ponds and flooded rice paddies divided by straight drainage canals under a wide open sky, a small square concrete pumping station standing alone at a canal junction, a cluster of village houses nearby each sitting on a noticeably raised earthen platform above the surrounding water level, the flat horizon unbroken by any hill or rise in any direction"

# ── 高雄 8 鄉鎮頁（KH-S4 尾批）2026-08-31 ──
kaohsiung-fengshan: "A modern Taiwanese lowland city on a dead-flat plain, a narrow straight concrete-lined irrigation channel running between ordinary present-day streets, its water shallow and not navigable, low modern concrete buildings with flat roofs and metal window grilles lining both banks, a plain flat road bridge crossing the channel, scooters and utility poles along the street, the channel continuing past the built-up edge into open flat farmland under a wide sky — no boats or sampans of any kind, no weeping willows, no arched stone bridge, no grey-tiled courtyard houses, no old Chinese canal town, no city wall or gate tower"
kaohsiung-taoyuan: "A steep subtropical mountain gorge in Taiwan, dense evergreen broadleaf forest and bamboo covering the slopes all the way to the rounded green ridgelines, a slender two-lane asphalt mountain road cut into the valley wall above a wide pale gravel riverbed, a small settlement of about a dozen low single-story houses with pitched corrugated-metal and tiled roofs standing on a flat river terrace above the water with small vegetable plots beside them — no snow anywhere, no bare rocky alpine peaks, no whitewashed flat-roofed stone buildings, no Himalayan or Tibetan architecture, no broad straight highway, no large bridge"
kaohsiung-gangshan: "A wide flat farming plain filling most of the view, a small low market town of one and two-storey rooftops with a slender brick chimney among the fields in the middle distance, and far back on the horizon one modest isolated wooded hill only a few hundred metres high with a gently flattened top and small pale limestone outcrops near its summit — the hill is low and unimposing, occupying only a small part of the sky, definitely not a towering mesa, not a cliff-walled plateau, not a dramatic tableland, not a mountain range — the plain, its fields and the town are the subject; no large lake, no reservoir, no dam in view"
kaohsiung-linyuan: "A wide river mouth opening onto the sea across a dead-flat coastal plain, a small fishing harbor with low wooden boats and drying nets on one bank of the river, and on the far bank tall industrial chimneys and storage tanks of a petrochemical complex rising directly behind a fringe of green mangrove wetland at the water's edge, low sandy dunes running along the open shoreline, the fishing harbor and the industrial skyline standing side by side across the same river mouth"
kaohsiung-niaosong: "A calm, gently rounded man-made lake ringed by shaded lakeside forest and quiet garden paths, its still water framed by low grassy banks rather than any tall dam wall or steep canyon cliffs, a flat gently rolling plain with scattered farmland spreading beyond the trees on every side, no mountain, no dramatic gorge, just one broad tranquil lake set in soft open lowland"
kaohsiung-alian: "A gentle foothill slope descending from the lower flank of a flat-topped mountain in the distance, terraced guava and fruit orchards climbing partway up the slope, giving way smoothly at the bottom of the incline to flat open vegetable and rice fields stretching across the plain, a network of narrow irrigation channels threading the flatland toward a wide river in the distance, no limestone cave, no hillside temple, only the quiet gradient where orchard meets farmland"
kaohsiung-renwu: "A flat plain where a new residential district of tidy modern low-rise housing blocks and straight paved streets stands directly beside open farmland still being tilled in neat rows, a small embanked irrigation pond with calm water reflecting the sky at the field's edge, gently rising wooded hills visible in the distance to the east, no petrochemical plant, no factory smokestacks anywhere in view"
kaohsiung-shanlin: "A broad river valley where a wide pale gravel riverbed runs beside flat, stepped river terraces, tidy rows of low single-story houses arranged in orderly streets on the terrace above the water, neat melon and fruit fields spreading across the flat terrace ground beside the houses, layered green mountains rising calmly on both sides of the valley under a peaceful daytime sky, an ordinary quiet rural scene with no ruins and no sign of disaster"

# ── 臺南批（TN，2026-09-01 起）──────────────────────────────
tainan-liuying: "Black-and-white Holstein dairy cows resting under open-sided steel-roofed cattle sheds on a dead-flat Taiwanese farming plain, a narrow-gauge rural railway track with a small quiet country platform running past the dairy farms, a long straight country road lined with dense old mango trees forming a green tunnel receding into the distance, low farmhouses and fish-scale clouds over the wide plain — no Western red barns, no silos, no rolling green hills, no fences of white timber"
tainan-houbi: "A dead-flat rice-paddy plain in southern Taiwan at harvest time, golden rice fields stretching to the horizon with a few round straw stacks standing in the stubble, a small modernist Catholic church in the middle distance whose roof is four tall pointed cones clad in aluminium rising like haystacks above the fields, a low old brick street of shophouses with a wooden rice mill at the field's edge, an elderly farmer in a conical hat walking a paddy bund — no mountains, no gothic spires, no cross-shaped church, no European village"
tainan-guanmiao: "Gently rising foothill farmland at the southern edge of Taiwan's Jianan plain, low rolling slopes covered with dense bamboo groves and terraced pineapple fields under strong sun, in the foreground rows of bamboo drying racks in a farm courtyard holding folded sheets of thin sun-dried wheat noodles, a small traditional temple with swallowtail roof ridges at the village center, a pond reflecting the hills — no high mountains, no rice terraces, no Japanese-style noodle shop, no tea plantations"
tainan-madou: "A low coastal plain in southwestern Taiwan where an ancient lagoon has silted up into farmland, wide pomelo orchards with round glossy-leaved trees heavy with pale green fruit in the foreground, an archaeological site with exposed lime-mortar quay foundations and a shallow water channel of an old inland harbour, fish ponds and reed beds toward the flat horizon, a few low farmhouses — completely flat land, no hills, no ocean waves, no tropical palms, no modern city"
tainan-zhongxi: "The old walled city quarter of Tainan, Taiwan seen from a low rooftop: a grid of narrow crooked lanes and red-tiled temple roofs with swallowtail ridges, a Confucian temple with vermilion walls and an old banyan tree, a surviving grey coral-stone city gate with an arched passage standing amid low shophouses, a small Japanese-era department store building with rounded corner at a street crossing, no city wall remaining but the curve of old harbour-canal streets visible in the lane pattern — no skyscrapers, no Chinese imperial palace, no Great Wall, no European cathedral"
tainan-yujing: "A broad flat-floored basin in southern Taiwan ringed on all sides by low forested hills, mango orchards in neat rows covering the basin floor and the lower slopes with round dark-green canopies and small blushing red-and-yellow fruit, a wide pale gravel river bed winding across the basin where two rivers meet, a modest wooded hill rising at one edge of the basin with a small stone memorial pillar on its top, a scatter of low tile-roofed farmhouses and a fruit collection shed among the orchards — an enclosed basin, no high mountain peaks, no rice terraces, no tea plantations, no battle scene, no soldiers"
tainan-xigang: "A dead-flat riverside farming township on the north bank of a wide river in southwestern Taiwan, a long straight earth-and-concrete flood embankment running across the middle distance with the broad shallow river and its sandy high-flood-plain fields beyond it, in the foreground open fields of sesame and slender green asparagus spears in sandy soil, a village temple with swallowtail roof ridges and tall festival flagpoles at the settlement centre, a large elaborately painted wooden ritual boat resting on trestles in an open temple courtyard, low farmhouses spread along a country road — completely flat land, no hills, no sea or waves, no lagoon, no modern city"
tainan-bei: "The northern quarter of an old Taiwanese city on a low flat terrace, seen at street level: a dense grid of narrow lanes of low two-storey shophouses with a covered public market hall of open steel trusses at one corner, a Buddhist monastery compound with red-tiled swallowtail roofs and old banyan trees set back behind a walled courtyard, a leafy urban park with a small oval lake and a Japanese-era pavilion just beyond the rooftops, a railway line running along the far edge of the district with a level crossing — no city wall or gate remaining, no skyscrapers, no imperial palace, no temple on a hill, no river"
