new-taipei-ruifang: "Steep pyramid-shaped rock peaks rising behind an old gold-mining town stacked in terraces on a mountainside that falls straight to the sea, mine entrances and ore-cart tracks cut into the slope, rocky capes and coves alternating along the coast below"
new-taipei-gongliao: "A single long golden sand beach split in two by a river mouth, laid across an otherwise rocky reef coastline of wide wave-cut intertidal platforms, with a ridge of green hills sinking into the Pacific at a far cape"
yilan: "A great triangular plain wedged between two mountain ranges that converge to a sharp inland apex, a single braided river fanning out from the mountain gate across a patchwork of rice fields toward the plain's wide open base along the Pacific shore"

# ── 19 主題頁 ────────────────────────────────────────────────
theme-coast: "A single sweeping coastline transect blending four distinct edges in one panorama, a rocky headland with wind-carved stone on the left, a wide muddy tidal flat at center, a coral-reef shallow bay further along, and a sheer cliff dropping straight to the sea on the right"
theme-earthquake: "A raw, fresh fault scarp splitting straight across a green rural valley floor, terraced rice fields abruptly stepped upward on one side, layered mountains looming behind"
theme-ecology: "A single mountain slope shown as a vertical transect, tropical coastal forest at its foot rising through subtropical broadleaf and misty temperate cypress forest to wind-stunted alpine scrub near a cloud-wrapped summit"
theme-fishery: "A heart-shaped stone tidal weir curving across a shallow intertidal flat at low tide, silhouetted fishing boats resting in a nearby cove and distant salt-pan pools glinting under open coastal sky"
theme-geothermal: "A misty valley of steaming sulfur vents and pale mineral-stained pools rising from cracked ground at the foot of volcanic hills, wisps of vapor drifting across terraced hot-spring basins"
theme-irrigation: "A historic irrigation canal winding away from a small stone river weir, threading through a patchwork of flooded rice paddies that mirror the sky toward distant hills"
theme-migration: "An old river-mouth landing point where a bamboo-palisaded earthen settlement wall encloses thatched houses among rice fields, small boats drawn up on the bank beneath layered coastal hills"
theme-mountains: "The jagged spine of Taiwan's central mountain range breaking above a sea of clouds, a deep rift valley trench visible far below between two parallel ranges"
theme-placenames: "A river-delta landscape where the faint earthworks of an old palisaded hamlet enclosure sit amid a patchwork of rice paddies and canals, layered traces of settlement visible in the fields at dusk"
theme-population: "A single wide horizon where a dense glowing cluster of city lights and rooftops on the left fades gradually into empty dark mountains and a quiet undeveloped coastline on the right at dusk"
theme-rain: "The same mountain ridge shown split down the middle, one side wrapped in heavy grey monsoon cloud pouring rain over misty terraced fields, the other side sunlit and dry with clear golden light"
theme-rivers: "A wide braided riverbed of pale gravel bars threaded by a few thin channels of water, mountains rising steeply behind and a long bridge spanning the empty stone expanse"
theme-soil: "A split landscape of dark, waterlogged black paddy soil in the foreground giving way to an exposed rust-red laterite terrace cliff face in the middle distance, green hills beyond"
theme-springs: "A shallow sandy-bottomed spring pond at the foot of misty hills, clusters of bubbles rising through clear water among reeds, small terraced ponds stepping away toward rice fields"
theme-tea: "Terraced tea plantations climbing in soft green rows up a steep, cloud-wrapped highland slope, mist drifting between the rows toward a high mountain ridge"
theme-temples: "An old temple's grand curved rooftop rising at the exact center of a village, narrow streets and rooftops radiating outward from the temple courtyard toward distant hills"
theme-transport: "A narrow road and rail line carved into the sheer face of a towering marble sea-cliff, clinging to the rock high above crashing waves with the cliff dropping straight into the Pacific"
theme-typhoon: "Dark swirling storm clouds massing over a harbor at dusk, fishing boats crowding into a sheltered cove ahead of the approaching wind, waves already whipping against a breakwater"
theme-wind: "A gust-swept coastal plain where drying racks of food sway sideways in strong wind beside a low dry-stone walled garden enclosure, wind-bent trees leaning uniformly in one direction"

# ── index 總論 tab 頂 ──────────────────────────────────────────
site-hero: "A sweeping aerial panorama of the whole island of Taiwan — a leaf-shaped island like a sweet potato, broad in the north and tapering to a narrow southern peninsula, its western coastline gently curved — the central mountain spine running north to south with a deep rift valley to its east, coastal plains fanning out to the west, rugged cliffs along the eastern shore, and small outlying islands scattered in the surrounding sea"
new-taipei-sanchong: "A dead-flat river-built lowland town across a wide slow river from a city, its western edge dominated by an immense straight grass-floored floodway channel even wider than the river itself, a low fixed weir sill at the floodway entrance holding back the main channel, ballfields and cycling paths spread on the floodway's green floor between levees, dense low rooftops crowding up to the embankment, and an iron truss bridge crossing the river toward the far bank"

# ── 鄉鎮頁擴充（新北 13 區）2026-07-28 ──
new-taipei-yonghe: "A completely hill-less flat lowland cradled inside a great horseshoe river bend that wraps it on three sides, the ground built up on the gentle inner bank of the curve, a long high levee wall shutting the settlement off from the water with a wide grassy flood terrace and reed beds lying outside it, and one narrow straight concrete-lined creek threading across the flatland"
new-taipei-luzhou: "A low, dead-flat sandbar of fresh river silt sitting island-like on the left bank of a broad tidal river's lower reach, water on every side — the wide estuary curving past one flank, a straight cut channel closing the other, a small drainage creek at its tail — an unbroken ring of embankment encircling the whole low ground, mudbanks glistening at low tide, and not a single hill anywhere in view"
new-taipei-wugu: "A bold volcanic mountain of stacked lava standing over the last narrow gateway where a great river squeezes out of an inland basin toward the sea, the raw blunt scar of its blasted-away rocky spur facing a low flat promontory on the opposite bank, a vast brackish reed marsh of tidal flats spreading below with flocks of waterbirds, and a thin band of settlement pinched between the mountain foot and the water"
new-taipei-taishan: "A ruler-straight fault scarp running north to south across the whole view like one enormous step cut in the ground, a high wooded tableland rim holding the western side and dead-flat basin farmland stretching east from its foot, clear springs welling up along the base of the step, two short streams running down and out across the low clay fields, and settlement strung in a single line along the scarp foot"
new-taipei-shulin: "A cobble-strewn braided riverbed of pale rounded boulders just below the point where a river leaves the hills, a low hill block of three rounded summits closing the western side above a narrow strip of flat land, marshy hollows and a low mid-channel bar out in the flats, a patchwork of constructed reed-filled treatment ponds at a tributary junction, and a detached block of orchards and fields marooned on the far bank"
new-taipei-tucheng: "A flat basin plain running out abruptly against a solid wall of forested mountains with no foothills in between, a single straight road pressed hard along the very base of the range with dense rooftops on one side and a mountain trailhead on the other, a sealed coal-mine adit and old spoil heap at the hill foot, a broad river hugging the far western edge, and an irrigation canal drawn from a valley mouth running north across the paddies"
new-taipei-shenkeng: "A narrow winding river valley serving as a natural corridor through the hills, a single-street old town strung in one line along the low terrace beside the stream with its arcaded shopfronts all facing the water, rows of tea bushes climbing the steep slopes directly behind the rooftops, and a small bridge crossing to the far bank where the road threads on up the valley"
new-taipei-shiding: "A deeply crenulated reservoir lake whose flooded side-valleys and drowned ridge tips break the water into countless small green islets and winding inlets, tightly folded mountains rising steeply all around with tea rows on their upper slopes, and downstream a tiny old street of stilt houses propped on tall timber posts overhanging a rocky creek in a shaded gorge"
new-taipei-pinglin: "A rain-misted upper river valley where a clear stream runs over pale bedrock and shallow gravel shoals, tea terraces stepping in narrow green bands up both valley walls into drifting cloud, an old low-arched stone bridge spanning the water on the valley floor, and a scatter of tea-drying yards on the flats beside the stream"
new-taipei-shuangxi: "Two clear mountain streams meeting at a quiet Y-shaped junction far inland with no plain at all, wooded hills closing in on every side, an old landing place of worn stone steps at the water's edge with a flat-bottomed poled boat moored below them, and a short row of low-roofed houses lining the bank above the confluence"
new-taipei-sanzhi: "A long smooth volcanic footslope descending northwest from the misty green shoulder of a volcanic range down to the sea, flooded terraced paddy fields stepping down the slope in stacked curving bands that mirror the sky, low flat marine terrace steps near the shore, and isolated farmsteads scattered thinly across the slope instead of any single town"
new-taipei-shimen: "The island's northernmost cape, a low rocky point reaching out into open sea with a slender lighthouse standing at its tip, a natural arch punched clean through a spur of rock at the water's edge, wind-faceted boulders with sharp planed faces strewn across the shore platform, and small windswept terraced fields on the exposed slope behind"
new-taipei-wanli: "Seen from the quay of a small fishing harbour tucked at a mountain's foot, moored boats and drying nets filling the foreground, the view looking out along a long low cape that reaches far into the sea — the tilted back of a one-sided cuesta ridge forming its spine, and a crowd of slender mushroom-shaped pedestal rocks standing on the wave-cut platform at its far tip"

